version: '3.8'

# PostgreSQL override for production deployment
# Usage: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up

services:
  database:
    image: postgres:16-alpine
    container_name: smart-shop-postgres
    environment:
      POSTGRES_USER: smartshop
      POSTGRES_PASSWORD: smartshop_dev_password
      POSTGRES_DB: smartshop
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartshop"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-shop-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PIP_TARGET: ".[postgres]"
    environment:
      DATABASE_URL: postgresql+psycopg://smartshop:smartshop_dev_password@database:5432/smartshop
      SECRET_KEY: dev-secret-key-change-in-production
      CORS_ORIGINS: http://localhost,http://frontend
      DEBUG: "false"
    depends_on:
      database:
        condition: service_healthy
    volumes: []  # Remove SQLite volume

volumes:
  postgres-data:
    driver: local

networks:
  smart-shop-network:
    driver: bridge
