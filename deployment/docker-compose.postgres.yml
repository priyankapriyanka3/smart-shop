# Docker Compose override for PostgreSQL production deployment
# Usage: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up

version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: smart-shop-db
    environment:
      POSTGRES_USER: smartshop
      POSTGRES_PASSWORD: changeme-in-production
      POSTGRES_DB: smartshop
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
      args:
        PIP_TARGET: ".[postgres]"
    environment:
      DATABASE_URL: postgresql+psycopg://smartshop:changeme-in-production@database:5432/smartshop
      JWT_SECRET: ${JWT_SECRET:-generate-secure-secret-for-production}
      BACKEND_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      database:
        condition: service_healthy
    volumes: []  # Override to remove SQLite volume

volumes:
  postgres-data:
    driver: local
